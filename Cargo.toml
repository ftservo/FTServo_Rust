[package]
name = "ftservo"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "FEETECH bus SDK for SMS/STS, SCSCL, HLS servos and bus IMUs"
license = "MIT"
readme = "README.md"
publish = false

[features]
default = ["serial"]
serial = ["dep:serialport"]

[dependencies]
serialport = { version = "=4.10.1", default-features = false, optional = true }

[[example]]
name = "ping"
required-features = ["serial"]

[[example]]
name = "sms_sts-read"
path = "examples/sms_sts/read.rs"
required-features = ["serial"]

[[example]]
name = "sms_sts-write"
